name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: psf_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail on new production advisories. deepmerge is ignored in package.json
      # (pnpm.auditConfig.ignoreGhsas) because it has no patched release; it is
      # low-severity and build-time only. Parse the advisory list rather than
      # the summary: pnpm keeps ignored findings in `metadata` but removes them
      # from `advisories`, and the text summary is misleading.
      - name: Audit production dependencies
        run: |
          pnpm audit --prod --json > audit.json || true
          node -e '
            const audit = require("./audit.json");
            const advisories = Object.keys(audit.advisories ?? {});
            if (advisories.length > 0) {
              console.error(`${advisories.length} production advisor${advisories.length === 1 ? "y" : "ies"}`);
              process.exit(1);
            }
            console.log("No production advisories.");
          '
      - run: pnpm check
      - run: pnpm check:desktop
      - run: pnpm lint
      # Coverage (not just a green test run): the thresholds in vitest.config.ts
      # are the merge gate. Running `pnpm test` here skipped them entirely.
      - run: pnpm test:coverage
      - run: pnpm --dir desktop test
      # The desktop Vite production build: `check:desktop` (tsc) and vitest do
      # not exercise the bundler, so a build-time regression (e.g. a `define`
      # that crashes the built app at boot) could merge unchecked.
      - run: pnpm build:desktop
      # Every DB-gated test file (discovered from the filesystem by
      # scripts/test-db.mjs, so a new one is picked up automatically) — a
      # hand-maintained list had silently stopped covering five suites.
      # Apply the committed migrations (not generate-on-the-fly): a schema
      # change without a committed SQL file must fail here, not in production.
      - run: pnpm db:check-migrations
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/psf_test
      - run: pnpm db:migrate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/psf_test
      - run: pnpm test:db
        env:
          RUN_DB_TESTS: "1"
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/psf_test
      # Verify the deployable artifacts build (web export + server bundle).
      - run: pnpm build
      # The Android JS bundle is a SEPARATE Metro resolution from web: a
      # Node-only import (e.g. impit's `node:fs`) can bundle fine on web but
      # break the Android release build, which `pnpm verify`/`pnpm build` never
      # exercise. This exports the Android bundle (no Android SDK needed) so a
      # Metro-resolution regression fails CI instead of shipping.
      - run: pnpm build:android-js
      # The web export compiles even when it renders a blank page at runtime;
      # this catches that class (e.g. import.meta in a classic script).
      # patchright has no postinstall, so its browsers must be installed
      # explicitly or chromium.launch() fails on a clean runner.
      - run: npx patchright install --with-deps chromium
      - run: pnpm smoke:web
      # Layout and contrast regressions: clipping/off-screen controls, tap
      # targets below 40px, duplicate accessible names, and WCAG AA failures in
      # light and dark mode across every route and phone/tablet/desktop width.
      - run: pnpm audit:layout
      - run: pnpm audit:contrast
      - run: pnpm audit:desktop
      # Drives the real first-run journey (onboarding, add, alert, snooze,
      # delete/undo) so functional regressions fail CI, not just visual ones.
      - run: pnpm e2e:smoke
      # The Android signing material is local-only and gitignored. Fail if a
      # force-add ever puts it in the repository (the gitleaks allowlist covers
      # the working tree, so this is the backstop for a committed file).
      - name: Ensure signing credentials stay untracked
        run: test -z "$(git ls-files credentials)"

  # The production image is the deploy artifact; nothing built it in CI, so a
  # broken Dockerfile (or a secret copied into the context) could ship unseen.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: omnishop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the production image runs as node
        run: |
          test "$(docker run --rm --entrypoint /usr/bin/id omnishop:ci -un)" = "node"
          test "$(docker run --rm --entrypoint /usr/bin/id omnishop:ci -u)" = "1000"

  # The desktop Rust backend (72 tests + clippy) ran only on developer machines;
  # nothing in CI compiled it, so a Rust regression could merge unchecked.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
      # tauri/wry need the GTK/WebKit development headers to compile.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test
        working-directory: desktop/src-tauri
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
