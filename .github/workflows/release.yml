name: Release Desktop

# Publishes signed desktop installers and the updater manifest (`latest.json`)
# on a version tag. `tauri.conf.json` (`plugins.updater.endpoints`) points at
# this repo's `releases/latest/download/latest.json`, so publishing the release
# is what makes the in-app "Check for updates" flow live.
#
# Requires repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY          (the updater private key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (optional)
# and the matching public key committed in
# `desktop/src-tauri/tauri.conf.json` -> `plugins.updater.pubkey`.
#
# The tag version must match `desktop/src-tauri/tauri.conf.json` `version`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Baked into the desktop renderer at build time. Without these the shipped app
# runs "local only": no sign-in, sync, push, or server-backed prices.
env:
  VITE_API_BASE_URL: https://web.omnishop.siamcreations.app
  VITE_VAPID_PUBLIC_KEY: BBKb-AAQjxTvXv_8Q1wKveZ_rVZ3fwl3Weue9MEcgvRBpFbHIqiJEoYmQn1LDQs7fr6TQ_wgnbinNZNv1jKoXbc

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.12.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
      # tauri/wry need the GTK/WebKit development headers to compile on Linux.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "OmniShop ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform from the assets below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
